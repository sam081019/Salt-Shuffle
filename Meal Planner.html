<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitchen Queen — Weekly Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Geist', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  *::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app/cookbook.jsx"></script>
<script type="text/babel" src="app/utility.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "daysCount": 5,
  "showKcal": false,
  "shuffleStyle": "cards",
  "typography": "default"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Typography swap — affects only the Cookbook direction's display font.
  // (Utility deliberately stays Geist to read as a tool.)
  const typoMap = {
    default: '"Instrument Serif", Georgia, serif',
    serif:   '"Source Serif 4", Georgia, serif',
    sans:    '"Geist", system-ui, sans-serif',
  };
  const typoVar = typoMap[t.typography] || typoMap.default;

  return (
    <>
      <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#f0eee9', '--cookbook-display': typoVar }}>
        <IOSDevice width={402} height={874}>
          <CookbookApp tweaks={t} />
        </IOSDevice>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Schedule">
          <TweakSlider label="Days planned" value={t.daysCount}
            min={3} max={7} step={1}
            onChange={v => setTweak('daysCount', v)} />
        </TweakSection>
        <TweakSection title="Display">
          <TweakToggle label="Show calorie count" value={t.showKcal}
            onChange={v => setTweak('showKcal', v)} />
          <TweakRadio label="Shuffle animation" value={t.shuffleStyle}
            options={[
              { value: 'cards', label: 'Cards' },
              { value: 'slot', label: 'Slot' },
              { value: 'stagger', label: 'Stagger' },
            ]}
            onChange={v => setTweak('shuffleStyle', v)} />
          <TweakSelect label="Cookbook display font"
            value={t.typography}
            options={[
              { value: 'default', label: 'Instrument Serif (default)' },
              { value: 'serif',   label: 'Source Serif 4' },
              { value: 'sans',    label: 'Geist Sans' },
            ]}
            onChange={v => setTweak('typography', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
