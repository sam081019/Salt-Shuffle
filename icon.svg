    <rect x="-16" y="-125" width="9" height="62" rx="4.5" fill="#fff"/>
    <rect x="-4"  y="-125" width="9" height="62" rx="4.5" fill="#fff"/>
    <rect x="8"   y="-125" width="9" height="62" rx="4.5" fill="#fff"/>
    <rect x="-5"  y="-68"  width="11" height="185" rx="5.5" fill="#fff"/>
  </g>

  <!-- Spoon rotated +42deg, pivot at crossing point (256,330) -->
  <g transform="translate(256,330) rotate(42)">
    <ellipse cx="0" cy="-100" rx="26" ry="36" fill="#fff"/>
    <rect x="-5.5" y="-67" width="11" height="185" rx="5.5" fill="#fff"/>
  </g>
