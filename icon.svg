<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Black background -->
  <rect width="512" height="512" rx="80" fill="#111"/>

  <!-- Chef's toque -->
  <path d="M178 228 Q172 118 256 108 Q340 118 334 228 Z" fill="#fff"/>
  <rect x="162" y="224" width="188" height="30" rx="4" fill="#fff"/>

  <!-- Fork rotated -42deg, pivot at crossing point (256,330) -->
